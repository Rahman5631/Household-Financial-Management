<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#065f46">
    <title>خانه‌حساب | ورود و ثبت‌نام</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <main class="auth-layout">
        <div class="auth-card">
            <div class="auth-logo">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#065f46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12l9-9 9 9"/>
                    <path d="M5 10v10h14V10"/>
                    <path d="M9 20v-6h6v6"/>
                </svg>
                <h1>خانه‌حساب</h1>
            </div>
            <p class="auth-subtitle">مدیریت هوشمند مالی خانواده</p>

            <!-- تب‌ها -->
            <div class="tabs" role="tablist">
                <button class="tab active" data-tab="login" role="tab">ورود</button>
                <button class="tab" data-tab="register" role="tab">ثبت‌نام</button>
            </div>

            <!-- فرم ورود -->
            <form id="form-login" class="tab-content" autocomplete="on">
                <div class="form-group">
                    <label for="login-email">ایمیل</label>
                    <input id="login-email" type="email" required autocomplete="email" dir="ltr">
                </div>
                <div class="form-group">
                    <label for="login-password">رمز عبور</label>
                    <input id="login-password" type="password" required autocomplete="current-password" dir="ltr">
                </div>
                <div class="form-error" id="login-error"></div>
                <button type="submit" class="btn btn-primary" id="btn-login">
                    <span>ورود به خانه‌حساب</span>
                </button>
                <div style="text-align:center; margin-top: 12px;">
                    <button type="button" class="btn btn-link" id="btn-forgot">رمز عبور را فراموش کرده‌اید؟</button>
                </div>
            </form>

            <!-- فرم ثبت‌نام -->
            <form id="form-register" class="tab-content" style="display:none;" autocomplete="on">
                <div class="form-group">
                    <label for="reg-name">نام و نام خانوادگی</label>
                    <input id="reg-name" type="text" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="reg-email">ایمیل</label>
                    <input id="reg-email" type="email" required autocomplete="email" dir="ltr">
                </div>
                <div class="form-group">
                    <label for="reg-password">رمز عبور (حداقل ۸ کاراکتر)</label>
                    <input id="reg-password" type="password" required minlength="8" autocomplete="new-password" dir="ltr">
                </div>
                <div class="form-group">
                    <label for="reg-household">نام خانواده (اختیاری)</label>
                    <input id="reg-household" type="text" placeholder="مثلاً: خانوادهٔ احمدی">
                </div>
                <div class="form-error" id="register-error"></div>
                <button type="submit" class="btn btn-primary" id="btn-register">
                    <span>ایجاد حساب کاربری</span>
                </button>
            </form>

            <!-- فرم بازیابی رمز -->
            <form id="form-forgot" class="tab-content" style="display:none;">
                <p style="font-size:13px; color:var(--color-text-muted); margin-bottom:16px;">
                    ایمیل خود را وارد کنید تا لینک بازیابی برایتان ارسال شود.
                </p>
                <div class="form-group">
                    <label for="forgot-email">ایمیل</label>
                    <input id="forgot-email" type="email" required dir="ltr">
                </div>
                <div class="form-error" id="forgot-error"></div>
                <button type="submit" class="btn btn-primary" id="btn-forgot-submit">
                    <span>ارسال لینک بازیابی</span>
                </button>
                <div style="text-align:center; margin-top: 12px;">
                    <button type="button" class="btn btn-link" id="btn-back-login">بازگشت به ورود</button>
                </div>
            </form>

            <!-- فرم تعیین رمز جدید (پس از کلیک روی لینک بازیابی) -->
            <form id="form-reset" class="tab-content" style="display:none;">
                <p style="font-size:13px; color:var(--color-text-muted); margin-bottom:16px;">
                    رمز عبور جدید خود را وارد کنید.
                </p>
                <div class="form-group">
                    <label for="reset-password">رمز عبور جدید</label>
                    <input id="reset-password" type="password" required minlength="8" dir="ltr">
                </div>
                <div class="form-error" id="reset-error"></div>
                <button type="submit" class="btn btn-primary" id="btn-reset-submit">
                    <span>ذخیرهٔ رمز جدید</span>
                </button>
            </form>
        </div>
    </main>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
